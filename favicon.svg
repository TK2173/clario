
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5685ff"/>
      <stop offset="100%" stop-color="#3153d8"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <g fill="none" stroke="#ffffff" stroke-width="15"
     stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
    <path d="M256 143 L151 337 L361 337 Z"/>
  </g>

  <g fill="#ffffff">
    <circle cx="256" cy="143" r="23"/>
    <circle cx="151" cy="337" r="23"/>
    <circle cx="361" cy="337" r="23"/>
  </g>

  <g fill="#b9d2ff">
    <circle cx="256" cy="143" r="8"/>
    <circle cx="151" cy="337" r="8"/>
    <circle cx="361" cy="337" r="8"/>
  </g>
</svg>
